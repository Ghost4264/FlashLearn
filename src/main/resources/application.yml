spring:
  application:
    name: flashlearn

  datasource:
    url: jdbc:postgresql://localhost:5432/flashlearn
    username: ${DB_USERNAME:flashlearn}
    password: ${DB_PASSWORD:flashlearn}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

app:
  jwt:
    secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-development}
    expiration-ms: 86400000
    refresh-expiration-ms: 18000000
  auth:
    refresh-token-cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174}
  ai:
    ollama:
      enabled: ${AI_OLLAMA_ENABLED:false}
      base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AI_OLLAMA_MODEL:qwen2.5:7b-instruct}
      timeout-seconds: ${AI_OLLAMA_TIMEOUT_SECONDS:60}
      auth-token: ${AI_OLLAMA_AUTH_TOKEN:}
    limits:
      requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
      requests-per-day: ${AI_REQUESTS_PER_DAY:100}
      min-seconds-between-requests: ${AI_MIN_SECONDS_BETWEEN_REQUESTS:3}
  limits:
    decks-created-per-day: ${DECKS_CREATED_PER_DAY:50}
    cards-created-per-day: ${CARDS_CREATED_PER_DAY:1000}

logging:
  level:
    com.flashlearn: INFO
    com.flashlearn.service.impl.ReviewServiceImpl: DEBUG
    org.springframework.security: INFO
