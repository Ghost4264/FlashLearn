services:
  postgres:
    image: postgres:16-alpine
    container_name: flashlearn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashlearn}
      POSTGRES_USER: ${POSTGRES_USER:-flashlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashlearn} -d ${POSTGRES_DB:-flashlearn}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
